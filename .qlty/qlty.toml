config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/*.d.ts",
]

test_patterns = [
  "**/*.test.*",
  "**/*.spec.*",
  "**/tests/**",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# biome handles both linting and formatting — do NOT add eslint or prettier alongside it
[[plugin]]
name = "biome"
mode = "comment"
config_files = ["biome.jsonc"]

[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "osv-scanner"
mode = "block"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "actionlint"
mode = "comment"

[[plugin]]
name = "yamllint"
mode = "comment"
